# Ejemplo RECONSTRUIDO a partir de la configuración observada.
# NO es una copia exportada ni verificada de /etc/prometheus/prometheus.yml
# Revisar rutas, otros jobs, reglas, alerting y etiquetas antes de su uso.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets:
          - '192.168.56.10:9100'
          - '192.168.56.20:9100'
        labels:
          environment: 'lab'
